<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      body { background: #15111a; }
      .wrap { display: flex; gap: 20px; padding: 16px; align-items: flex-start; }
      .col { width: 420px; }
      h3 { color: #9a92aa; font: 600 12px monospace; margin: 0 0 6px; }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap"></div>
    <script type="module">
      import { createRoot } from "react-dom/client";
      import { createElement as h, StrictMode } from "react";
      import { BotBrain, CONNECT4, CONNECT5, Match, byId, reviewMatch } from "@fourscore/engine";
      import { Review } from "/src/ui/Review.tsx";

      /** Deterministic, so the preview looks the same on every run. */
      function rngFor(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /** A real game between two mid-ladder bots, which is what a review sees. */
      function playGame(variant, seed) {
        const rng = rngFor(seed);
        const a = new BotBrain(byId("bramble"), rng);
        const b = new BotBrain(byId("moss"), rng);
        const match = new Match(variant);
        while (match.status === "playing") {
          const brain = match.position.moves % 2 === 0 ? a : b;
          match.play(brain.decide(match.position).col);
        }
        return match;
      }

      const cases = [
        { title: "Connect 4 — solver reaches most of it", variant: CONNECT4, seed: 7 },
        { title: "Connect 5 — mostly the engine's read", variant: CONNECT5, seed: 3 },
      ];

      for (const c of cases) {
        const match = playGame(c.variant, c.seed);
        const review = reviewMatch(match.history, { forPlayer: "red", variant: c.variant });
        console.log(c.title, {
          proven: review.plies.filter((p) => p.source === "proven").length,
          estimated: review.plies.filter((p) => p.source === "estimated").length,
          swing: review.biggestSwing?.ply,
          turning: review.turningPoint?.ply,
        });

        const col = document.createElement("div");
        col.className = "col";
        const head = document.createElement("h3");
        head.textContent = c.title;
        col.appendChild(head);
        const mount = document.createElement("div");
        col.appendChild(mount);
        document.getElementById("wrap").appendChild(col);

        createRoot(mount).render(
          h(StrictMode, null,
            h(Review, {
              review,
              humanPlayer: "red",
              lost: match.winner === "yellow",
              selected: review.turningPoint?.ply ?? review.biggestSwing?.ply ?? null,
              onSelect: () => {},
              onBack: () => {},
              onRematch: () => {},
              variant: c.variant,
            }),
          ),
        );
      }
    </script>
  </body>
</html>
